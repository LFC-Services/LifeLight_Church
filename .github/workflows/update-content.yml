name: Update church content
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Content operation in JSON
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: church-content
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update JSON
        env:
          CONTENT_PAYLOAD: ${{ inputs.payload }}
        run: python scripts/update_content.py
      - name: Commit JSON
        run: |
          if git diff --quiet -- data/content.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          git commit -m "Update church content"
          git push
      - name: Redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
