<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교회 관리자</title><link rel="stylesheet" href="../assets/style.css"><style>main{max-width:780px;margin:30px auto;padding:20px}.fields{display:grid;gap:12px}input,textarea,select{width:100%;padding:12px;border:1px solid #ced8d0;border-radius:6px}label{font-weight:650}button{padding:12px;border:0;background:#244c40;color:white;border-radius:5px;margin:4px}section{border:1px solid #e2e8e2;padding:20px;margin:20px 0;border-radius:10px}.item{border-bottom:1px solid #ddd;padding:12px 0}</style></head><body><header class="site-head"><a class="logo" href="../">✝ 생명의 빛 감리교회</a><nav><a href="../">홈페이지로 돌아가기</a></nav></header><main><h1>교회 홈페이지 관리자</h1><p>GitHub 저장소에 권한이 있는 관리자만 사용하세요. 토큰은 서버나 브라우저 저장소에 보관되지 않습니다.</p><section class="fields"><label>저장소</label><input id="repo" value="LFC-Services/LifeLight_Church"><label>브랜치</label><input id="branch" value="main"><label>GitHub Fine-grained PAT</label><input id="token" type="password" autocomplete="off" placeholder="Contents 및 Actions 쓰기 권한"><button id="connect">콘텐츠 불러오기</button></section><section><h2>게시글 등록·수정</h2><form id="form" class="fields"><input id="id" type="hidden"><label>종류</label><select id="type"><option value="sermons">설교</option><option value="bulletins">주보</option><option value="albums">앨범</option><option value="events">행사</option></select><label>제목</label><input id="title" required><label>하위 카테고리</label><input id="category" list="categories"><datalist id="categories"></datalist><label>날짜</label><input id="date" type="date"><label>본문</label><textarea id="body" rows="6"></textarea><label>이미지 업로드</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><label>기존 이미지 URL</label><input id="image"><label>관련 영상·링크 URL</label><input id="link"><div><button type="submit">Action으로 저장</button><button id="clear" type="button">새 글</button></div></form></section><section><h2>등록된 글</h2><select id="filter"><option value="sermons">설교</option><option value="bulletins">주보</option><option value="albums">앨범</option><option value="events">행사</option></select><div id="items"></div></section><section><h2>하위 카테고리 관리</h2><select id="cat-type"><option value="sermons">설교</option><option value="bulletins">주보</option><option value="albums">앨범</option></select><label>쉼표로 구분</label><input id="cat-values"><button id="save-categories">카테고리 저장</button></section><p role="status" id="status"></p></main><script src="admin.js" defer></script></body></html>
